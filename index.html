<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The People Project — by Steven M. Rose</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: 'Lato', sans-serif;
      background: #fff;
      color: #111;
      min-height: 100vh;
    }
 
    /* ── HERO SECTION ── */
    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }
 
    /* Scrolling grid of faces behind bench */
    .face-wall {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding: 6px;
      overflow: hidden;
    }
 
    .face-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
 
    .face-cell {
      flex: 0 0 auto;
      aspect-ratio: 1;
      background: #eee;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.2s;
    }
 
    .face-cell:hover { opacity: 0.8; }
 
    .face-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      filter: grayscale(15%);
    }
 
    .face-cell .f-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #bbb;
      background: #f0f0f0;
    }
 
    /* Bench image pinned to bottom, full width, above grid */
    .bench-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
 
    .bench-img {
      width: 65%;
      max-width: 700px;
      display: block;
      filter: grayscale(100%);
    }
 
    /* Title overlay — top center */
    .hero-title-block {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      text-align: center;
      padding: 36px 24px 24px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95) 60%, transparent 100%);
    }
 
    .site-eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: #888; margin-bottom: 10px;
    }
 
    .site-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 400; color: #111; line-height: 1.05; margin-bottom: 8px;
    }
 
    .site-byline {
      font-size: 11px; font-weight: 300; letter-spacing: 0.14em;
      text-transform: uppercase; color: #aaa;
    }
 
    /* ── LATEST STRIP ── */
    .latest-section { background: #111; padding: 18px 24px; }
    .latest-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: #fff; margin-bottom: 12px;
    }
    .latest-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .latest-scroll::-webkit-scrollbar { display: none; }
    .latest-card { flex: 0 0 auto; width: 68px; cursor: pointer; transition: transform 0.2s; }
    .latest-card:hover { transform: translateY(-3px); }
    .latest-card img, .latest-card .l-ph {
      width: 68px; height: 68px; object-fit: cover; object-position: top;
      display: block; border: 2px solid transparent; transition: border-color 0.2s;
    }
    .latest-card .l-ph {
      background: #2a2a2a; display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #555;
    }
    .latest-card:hover img, .latest-card:hover .l-ph { border-color: #fff; }
    .latest-card-name { font-size: 9px; color: #777; margin-top: 5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 
    /* ── MR ROGERS QUOTE ── */
    .quote-section {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 36px 24px;
      text-align: center;
    }
    .quote-text {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      color: #333; max-width: 560px; margin: 0 auto; line-height: 1.8;
    }
    .quote-cite {
      display: block; font-family: 'Lato', sans-serif; font-style: normal;
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #aaa; margin-top: 12px;
    }
 
    /* ── EVERYONE GRID ── */
    .grid-section { padding: 40px 20px 80px; max-width: 1400px; margin: 0 auto; }
    .grid-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; border-bottom: 1px solid #ddd; padding-bottom: 14px; }
    .grid-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 400; }
    .grid-count { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #aaa; }
    .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
    .person-card { cursor: pointer; }
    .person-card-img-wrap { position: relative; overflow: hidden; aspect-ratio: 1; background: #f0f0f0; }
    .person-card img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; filter: grayscale(20%); transition: transform 0.35s ease, filter 0.25s ease; }
    .person-card:hover img { transform: scale(1.06); filter: grayscale(0%); }
    .p-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 2rem; color: #bbb; }
    .person-card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 55%); opacity: 0; transition: opacity 0.25s; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
    .person-card:hover .person-card-overlay { opacity: 1; }
    .overlay-name { font-family: 'Playfair Display', serif; font-size: 0.75rem; color: #fff; line-height: 1.2; margin-bottom: 2px; }
    .overlay-read { font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #ccc; }
 
    /* ── MODAL ── */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 200; overflow-y: auto; padding: 40px 20px; }
    .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal { background: #fff; max-width: 680px; width: 100%; margin: auto; position: relative; }
    .modal-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 24px; color: #aaa; cursor: pointer; z-index: 10; transition: color 0.2s; }
    .modal-close:hover { color: #111; }
    .modal-photo { width: 100%; max-height: 400px; object-fit: cover; object-position: top; display: block; filter: grayscale(10%); }
    .modal-ph { width: 100%; height: 240px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 4rem; color: #ccc; }
    .modal-body { padding: 36px 48px 56px; }
    .modal-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #111; margin-bottom: 10px; }
    .modal-name { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 400; color: #111; line-height: 1.1; margin-bottom: 6px; }
    .modal-date { font-size: 11px; color: #aaa; font-weight: 300; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid #ddd; }
    .modal-letter { font-size: 1.05rem; line-height: 1.9; color: #333; white-space: pre-line; }
 
    /* ── FOOTER ── */
    footer { background: #fff; border-top: 1px solid #ddd; text-align: center; padding: 28px; font-size: 11px; color: #aaa; letter-spacing: 0.06em; }
 
    @media (max-width: 600px) {
      .bench-img { width: 90%; }
      .people-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 4px; }
      .modal-body { padding: 24px 20px 40px; }
      .face-wall { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
 
  <!-- HERO -->
  <div class="hero-section" id="heroSection">
    <div class="face-wall" id="faceWall"></div>
    <div class="bench-wrap">
      <img class="bench-img" src="photos/hero.jpg" alt="Three people on a bench" />
    </div>
    <div class="hero-title-block">
      <p class="site-eyebrow">A Writing Project</p>
      <h1 class="site-title">The People Project</h1>
      <p class="site-byline">by Steven M. Rose</p>
    </div>
  </div>
 
  <!-- LATEST -->
  <section class="latest-section">
    <p class="latest-label">Latest Entries</p>
    <div class="latest-scroll" id="latestRow"></div>
  </section>
 
  <!-- QUOTE -->
  <div class="quote-section">
    <blockquote class="quote-text">
      "You've made this day a special day, by just your being you. There's no person in the whole world like you; and I like you just the way you are."
      <cite class="quote-cite">— Fred Rogers</cite>
    </blockquote>
  </div>
 
  <!-- GRID -->
  <section class="grid-section">
    <div class="grid-header">
      <h2 class="grid-title">Everyone</h2>
      <span class="grid-count" id="gridCount"></span>
    </div>
    <div class="people-grid" id="peopleGrid"></div>
  </section>
 
  <footer>&copy; <span id="year"></span> The People Project &nbsp;·&nbsp; by Steven M. Rose</footer>
 
  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>
 
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
 
    async function loadPeople() {
      const res = await fetch('people.json');
      const people = await res.json();
      return people.sort((a, b) => new Date(b.date) - new Date(a.date));
    }
 
    function formatDate(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    }
 
    function ini(name) { return name.charAt(0).toUpperCase(); }
 
    function openModal(p) {
      document.getElementById('modalContent').innerHTML = `
        <div style="position:relative;">
          <img src="${p.photo}" alt="${p.name}" class="modal-photo"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
          <div class="modal-ph" style="display:none;">${ini(p.name)}</div>
        </div>
        <div class="modal-body">
          <p class="modal-eyebrow">The People Project</p>
          <h2 class="modal-name">${p.name}</h2>
          <p class="modal-date">${formatDate(p.date)}</p>
          <p class="modal-letter">${p.letter}</p>
        </div>`;
      document.getElementById('modalBackdrop').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
 
    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      document.body.style.overflow = '';
    }
 
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
 
    async function init() {
      const people = await loadPeople();
 
      // ── FACE WALL ──
      const wall = document.getElementById('faceWall');
      const cols = 5;
      const colEls = [];
      for (let i = 0; i < cols; i++) {
        const col = document.createElement('div');
        col.className = 'face-col';
        wall.appendChild(col);
        colEls.push(col);
      }
 
      // Fill columns with repeating people, each column offset differently
      const cellHeight = () => wall.offsetWidth / cols;
 
      function fillCol(colEl, colIndex, peopleList) {
        // How many cells needed to fill viewport height + buffer
        const needed = Math.ceil((window.innerHeight * 2) / cellHeight()) + 4;
        colEl.innerHTML = '';
        for (let i = 0; i < needed; i++) {
          const p = peopleList[(colIndex * 3 + i) % peopleList.length];
          const cell = document.createElement('div');
          cell.className = 'face-cell';
          cell.innerHTML = `
            <img src="${p.photo}" alt="${p.name}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
            <div class="f-placeholder" style="display:none;">${ini(p.name)}</div>`;
          cell.addEventListener('click', () => openModal(p));
          colEl.appendChild(cell);
        }
      }
 
      colEls.forEach((col, i) => fillCol(col, i, people));
 
      // Animate columns — alternating up/down, different speeds
      const speeds = [38, 52, 44, 60, 48]; // seconds per full cycle
      const directions = [1, -1, 1, -1, 1]; // up or down
 
      colEls.forEach((col, i) => {
        const totalH = col.scrollHeight;
        let pos = directions[i] === 1 ? 0 : -totalH / 2;
        const speed = speeds[i];
 
        function animate() {
          pos += directions[i] * 0.4;
          if (directions[i] === 1 && pos > totalH / 2) pos = 0;
          if (directions[i] === -1 && pos < -totalH / 2) pos = 0;
          col.style.transform = `translateY(${pos}px)`;
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      });
 
      // ── LATEST ROW ──
      const lr = document.getElementById('latestRow');
      people.slice(0, 8).forEach(p => {
        const c = document.createElement('div');
        c.className = 'latest-card';
        c.innerHTML = `
          <img src="${p.photo}" alt="${p.name}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
          <div class="l-ph" style="display:none;">${ini(p.name)}</div>
          <p class="latest-card-name">${p.name.split(' ')[0]}</p>`;
        c.addEventListener('click', () => openModal(p));
        lr.appendChild(c);
      });
 
      // ── MAIN GRID ──
      const grid = document.getElementById('peopleGrid');
      document.getElementById('gridCount').textContent = `${people.length} ${people.length === 1 ? 'person' : 'people'}`;
      people.forEach(p => {
        const c = document.createElement('div');
        c.className = 'person-card';
        c.innerHTML = `
          <div class="person-card-img-wrap">
            <img src="${p.photo}" alt="${p.name}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
            <div class="p-ph" style="display:none;">${ini(p.name)}</div>
            <div class="person-card-overlay">
              <p class="overlay-name">${p.name}</p>
              <p class="overlay-read">Read &rarr;</p>
            </div>
          </div>`;
        c.addEventListener('click', () => openModal(p));
        grid.appendChild(c);
      });
    }
 
    init();
  </script>
</body>
</html>
