<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The People Project — by Steven M. Rose</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:     #f5f0e8;
      --warm-white:#faf8f4;
      --ink:       #1c1a18;
      --ink-light: #4a4540;
      --ink-faint: #9a9088;
      --gold:      #b8913a;
      --gold-light:#d4aa5a;
      --rule:      #ddd5c4;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--warm-white);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--cream);
      border-bottom: 1px solid var(--rule);
      padding: 48px 32px 40px;
      text-align: center;
    }

    .site-eyebrow {
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .site-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .site-byline {
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 28px;
    }

    .site-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--ink-light);
      max-width: 540px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .site-quote cite {
      display: block;
      font-family: 'Lato', sans-serif;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-top: 10px;
    }

    /* ── LATEST ROW ── */
    .latest-section {
      background: var(--ink);
      padding: 28px 32px;
    }

    .latest-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .latest-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .latest-scroll::-webkit-scrollbar { display: none; }

    .latest-card {
      flex: 0 0 auto;
      width: 80px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .latest-card:hover { transform: translateY(-3px); }

    .latest-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      object-position: top;
      display: block;
      filter: grayscale(30%);
      border: 2px solid transparent;
      transition: border-color 0.2s, filter 0.2s;
    }

    .latest-card:hover img {
      border-color: var(--gold);
      filter: grayscale(0%);
    }

    .latest-card-name {
      font-size: 10px;
      font-weight: 400;
      color: #aaa;
      margin-top: 6px;
      text-align: center;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── GRID SECTION ── */
    .grid-section {
      padding: 48px 32px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 16px;
    }

    .grid-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--ink);
    }

    .grid-count {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .people-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 24px;
    }

    .person-card {
      cursor: pointer;
      group: true;
    }

    .person-card-img-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--rule);
    }

    .person-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      filter: grayscale(20%);
      transition: transform 0.4s ease, filter 0.3s ease;
    }

    .person-card:hover img {
      transform: scale(1.04);
      filter: grayscale(0%);
    }

    .person-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(28,26,24,0.7) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }

    .person-card:hover .person-card-overlay {
      opacity: 1;
    }

    .person-card-overlay-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .person-card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      margin-top: 10px;
      line-height: 1.3;
    }

    .person-card-date {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 3px;
      font-weight: 300;
    }

    /* placeholder for missing photos */
    .photo-placeholder {
      width: 100%;
      height: 100%;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--ink-faint);
    }

    /* ── MODAL ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28,26,24,0.85);
      z-index: 100;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }

    .modal {
      background: var(--warm-white);
      max-width: 680px;
      width: 100%;
      margin: auto;
      padding: 0;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--ink-faint);
      cursor: pointer;
      line-height: 1;
      z-index: 10;
      transition: color 0.2s;
    }

    .modal-close:hover { color: var(--ink); }

    .modal-photo {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      object-position: top;
      display: block;
      filter: grayscale(15%);
    }

    .modal-photo-placeholder {
      width: 100%;
      height: 260px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: var(--ink-faint);
    }

    .modal-body {
      padding: 40px 48px 56px;
    }

    .modal-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .modal-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .modal-date {
      font-size: 12px;
      color: var(--ink-faint);
      font-weight: 300;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--rule);
    }

    .modal-letter {
      font-family: 'Lato', sans-serif;
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--ink-light);
      white-space: pre-line;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--cream);
      border-top: 1px solid var(--rule);
      text-align: center;
      padding: 32px;
      font-size: 12px;
      color: var(--ink-faint);
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { padding: 36px 20px 32px; }
      .grid-section { padding: 36px 16px 60px; }
      .latest-section { padding: 24px 16px; }
      .modal-body { padding: 28px 24px 40px; }
      .people-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <p class="site-eyebrow">A Writing Project</p>
    <h1 class="site-title">The People Project</h1>
    <p class="site-byline">by Steven M. Rose</p>
    <blockquote class="site-quote">
      "You've made this day a special day, by just your being you. There's no person in the whole world like you; and I like you just the way you are."
      <cite>— Fred Rogers</cite>
    </blockquote>
  </header>

  <!-- LATEST ENTRIES ROW -->
  <section class="latest-section">
    <p class="latest-label">Latest Entries</p>
    <div class="latest-scroll" id="latestRow"></div>
  </section>

  <!-- MAIN GRID -->
  <section class="grid-section">
    <div class="grid-header">
      <h2 class="grid-title">Everyone</h2>
      <span class="grid-count" id="gridCount"></span>
    </div>
    <div class="people-grid" id="peopleGrid"></div>
  </section>

  <!-- FOOTER -->
  <footer>
    &copy; <span id="year"></span> The People Project &nbsp;·&nbsp; by Steven M. Rose
  </footer>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadPeople() {
      const res = await fetch('people.json');
      const people = await res.json();
      return people.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function getInitial(name) {
      return name.charAt(0).toUpperCase();
    }

    function imgOrPlaceholder(person, cls, placeholderSize) {
      return `
        <img
          src="${person.photo}"
          alt="${person.name}"
          class="${cls}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        />
        <div class="photo-placeholder" style="display:none; font-size:${placeholderSize};">
          ${getInitial(person.name)}
        </div>
      `;
    }

    function openModal(person) {
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div style="position:relative;">
          <img
            src="${person.photo}"
            alt="${person.name}"
            class="modal-photo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="modal-photo-placeholder" style="display:none;">${getInitial(person.name)}</div>
        </div>
        <div class="modal-body">
          <p class="modal-eyebrow">The People Project</p>
          <h2 class="modal-name">${person.name}</h2>
          <p class="modal-date">${formatDate(person.date)}</p>
          <p class="modal-letter">${person.letter}</p>
        </div>
      `;
      document.getElementById('modalBackdrop').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    async function init() {
      const people = await loadPeople();

      // Latest row (5 most recent)
      const latestRow = document.getElementById('latestRow');
      people.slice(0, 5).forEach(person => {
        const card = document.createElement('div');
        card.className = 'latest-card';
        card.innerHTML = `
          <img
            src="${person.photo}"
            alt="${person.name}"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="photo-placeholder" style="display:none; width:80px; height:80px; font-size:1.6rem;">${getInitial(person.name)}</div>
          <p class="latest-card-name">${person.name.split(' ')[0]}</p>
        `;
        card.addEventListener('click', () => openModal(person));
        latestRow.appendChild(card);
      });

      // Main grid
      const grid = document.getElementById('peopleGrid');
      document.getElementById('gridCount').textContent = `${people.length} ${people.length === 1 ? 'person' : 'people'}`;

      people.forEach(person => {
        const card = document.createElement('div');
        card.className = 'person-card';
        card.innerHTML = `
          <div class="person-card-img-wrap">
            <img
              src="${person.photo}"
              alt="${person.name}"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />
            <div class="photo-placeholder" style="display:none; font-size:2.5rem;">${getInitial(person.name)}</div>
            <div class="person-card-overlay">
              <span class="person-card-overlay-text">Read</span>
            </div>
          </div>
          <p class="person-card-name">${person.name}</p>
          <p class="person-card-date">${formatDate(person.date)}</p>
        `;
        card.addEventListener('click', () => openModal(person));
        grid.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
